[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosh"
version = "0.1.0"
description = "Settlement reconciliation for Indian merchants: tiered matching, typed exceptions, tamper-evident audit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# No runtime dependencies. The engine, HTTP layer and ledger are stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kosh = "kosh.__main__:main"

[tool.setuptools.packages.find]
include = ["kosh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 108
target-version = "py311"
